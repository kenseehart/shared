[project]
name = "ken-mcp"
version = "0.1.0"
description = "Shared MCP utilities: GitHub sign-in for Claude connectors, health route, audit log"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14,<3",
    "httpx>=0.27",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ken_mcp"]
